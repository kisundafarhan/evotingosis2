<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>E-Voting OSIS SMAN 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Design system: dari logo SMAN 2 Tambun Selatan. Putih bersih, biru logo, emas, hijau. Glass ringan. */
:root{
  --c-blue:#0090C8; --c-blue6:#007BAD; --c-blue5:#EAF6FC; --c-blue1:#D2ECF8;
  --c-navy:#0B3A5E; --c-gold:#F0B400; --c-gold5:#FFF7DB; --c-goldd:#8A6500;
  --c-green:#069941; --c-green5:#E6F6EC; --c-red:#DC2626; --c-red5:#FDECEC;
  --c-ink:#212222; --c-muted:#58707E; --c-line:#D6E6EF; --c-bg:#FFFFFF; --c-surf:#F5FAFD;
  --c-font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --c-mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
:where(#ev,#ev *){box-sizing:border-box}
:where(#ev *){margin:0;padding:0}
#ev{position:fixed;inset:0;z-index:2147483000;overflow:auto;background:var(--c-bg);color:var(--c-ink);font:500 15px/1.5 var(--c-font);-webkit-font-smoothing:antialiased;color-scheme:light}
#ev-view{min-height:100%;display:flex;flex-direction:column}
#ev-view>.vl,#ev-view>.vb,#ev-view>.sh,#ev-view>.done{flex:1 0 auto}
:where(#ev) :is(button,input,select,textarea){font:inherit;color:inherit}

:where(#ev) button{cursor:pointer;background:none;border:0}
#ev [hidden]{display:none!important}
:where(#ev) a{color:var(--c-blue6)}
#ev svg.i{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#ev :focus-visible{outline:3px solid var(--c-gold);outline-offset:2px}
.ev-bg{background:radial-gradient(900px 520px at 100% -10%,var(--c-blue5),transparent 60%),radial-gradient(700px 420px at -10% 110%,var(--c-gold5),transparent 55%),var(--c-bg)}

/* ---------- Komponen dasar ---------- */
.glass{background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(214,230,239,.95);box-shadow:0 1px 2px rgba(11,58,94,.05),0 10px 30px -12px rgba(11,58,94,.16)}
.card{border-radius:16px;padding:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:12px;font-weight:700;font-size:14px;background:var(--c-blue6);color:#fff;border:1px solid transparent;transition:background .15s,transform .1s,box-shadow .15s;white-space:nowrap}
.btn:hover{background:var(--c-navy)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.gold{background:var(--c-gold);color:var(--c-navy)}.btn.gold:hover{background:#FFC61A}
.btn.green{background:var(--c-green)}.btn.green:hover{background:#05803A}
.btn.red{background:var(--c-red)}.btn.red:hover{background:#B91C1C}
.btn.ghost{background:#fff;color:var(--c-navy);border-color:var(--c-line)}.btn.ghost:hover{background:var(--c-blue5)}
.btn.lg{min-height:56px;font-size:17px;border-radius:14px;padding:0 28px}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.ibtn{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:10px;color:var(--c-muted)}
.ibtn:hover{background:var(--c-blue5);color:var(--c-navy)}.ibtn.danger:hover{background:var(--c-red5);color:var(--c-red)}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>label,.lbl{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--c-muted)}
.inp{width:100%;min-height:44px;padding:0 14px;border:1.5px solid var(--c-line);border-radius:12px;background:#fff;outline:0;transition:border .15s,box-shadow .15s}
textarea.inp{padding:10px 14px;min-height:88px;resize:vertical}
.inp:focus{border-color:var(--c-blue);box-shadow:0 0 0 4px rgba(0,144,200,.15)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--c-blue5);color:var(--c-navy);white-space:nowrap}
.chip.ok{background:var(--c-green5);color:#05632B}.chip.no{background:var(--c-gold5);color:var(--c-goldd)}.chip.bad{background:var(--c-red5);color:#A61B1B}.chip.gold{background:var(--c-gold5);color:var(--c-goldd)}
.muted{color:var(--c-muted)}.small{font-size:13px}.mono{font-family:var(--c-mono)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:0}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:14px;background:var(--c-blue5);color:var(--c-navy);border:1px solid var(--c-blue1)}
.alert.warn{background:var(--c-gold5);border-color:#F3DC8D;color:#5E4500}.alert.err{background:var(--c-red5);border-color:#F6C4C4;color:#8F1717}.alert.ok{background:var(--c-green5);border-color:#BFE6CD;color:#05632B}
.empty{display:grid;place-items:center;gap:8px;text-align:center;padding:44px 16px;color:var(--c-muted)}
.empty .i{width:40px;height:40px;color:var(--c-blue)}
.bar{height:12px;border-radius:99px;background:var(--c-blue5);overflow:hidden}.bar>i{display:block;height:100%;border-radius:99px;background:var(--c-blue);transition:width .5s ease}
.bar.g>i{background:var(--c-green)}.bar.y>i{background:var(--c-gold)}
.preview-badge{display:flex;gap:8px;align-items:center;justify-content:center;background:var(--c-gold);color:var(--c-navy);font-size:12px;font-weight:800;letter-spacing:.04em;padding:6px 12px}

/* ---------- Layar pemilih / login ---------- */
.vl{min-height:100%;display:grid;grid-template-columns:minmax(320px,42%) 1fr}
.vl-side{background:linear-gradient(160deg,var(--c-navy) 0%,#0A6C9E 62%,var(--c-blue) 100%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:40px;text-align:center;position:relative;overflow:hidden}
.vl-side:before,.vl-side:after{content:"";position:absolute;border-radius:50%;border:1.5px solid rgba(255,255,255,.14)}
.vl-side:before{width:520px;height:520px;left:-200px;bottom:-240px}.vl-side:after{width:380px;height:380px;right:-160px;top:-140px}
.logo-badge{width:min(196px,46%);aspect-ratio:1;border-radius:50%;background:#fff;display:grid;place-items:center;position:relative;z-index:1;box-shadow:0 0 0 7px rgba(255,255,255,.16),0 10px 26px rgba(4,30,52,.22)}
.vl-logo{width:80%;height:auto;display:block;image-rendering:auto}
.vl-side h1{font-size:clamp(24px,2.6vw,34px);line-height:1.2;font-weight:800;text-wrap:balance;position:relative;z-index:1}
.vl-side p{opacity:.92;position:relative;z-index:1}
.motto{display:inline-block;background:var(--c-gold);color:var(--c-navy);font-weight:800;padding:7px 18px;border-radius:99px;font-size:14px;letter-spacing:.02em;position:relative;z-index:1}
.vl-main{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:32px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));gap:20px;min-width:0}
.vl-card{width:100%;max-width:440px;display:flex;flex-direction:column;gap:18px}
.vl-card h2{font-size:26px;font-weight:800;color:var(--c-navy);line-height:1.2}
.token-inp{font-family:var(--c-mono);font-size:24px;letter-spacing:.3em;text-transform:uppercase;text-align:center;min-height:56px}
.nipd-inp{font-size:20px;min-height:56px;letter-spacing:.06em}
.credit{font-size:12.5px;color:var(--c-muted);text-align:center}.credit b{color:var(--c-navy)}
.vl-side .credit{color:rgba(255,255,255,.75);position:relative;z-index:1}.vl-side .credit b{color:#fff}
.status-pill{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;padding:8px 12px;border-radius:12px}
.status-pill.open{background:var(--c-green5);color:#05632B}.status-pill.closed{background:var(--c-red5);color:#8F1717}
.dot{width:9px;height:9px;border-radius:50%;background:currentColor}
.bilik-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.bilik-pick .btn{min-height:64px;font-size:18px}

/* ---------- Scan QR ---------- */
.or{display:flex;align-items:center;gap:12px;color:var(--c-muted);font-size:13px;font-weight:700}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--c-line)}
.scan{position:relative;aspect-ratio:4/3;background:var(--c-navy);border-radius:16px;overflow:hidden}
.scan video{width:100%;height:100%;object-fit:cover;display:block}
.scan-frame{position:absolute;inset:16% 22%;border:4px solid var(--c-gold);border-radius:18px;box-shadow:0 0 0 999px rgba(11,58,94,.5);pointer-events:none}
.qrbox{background:#fff;border:1px solid var(--c-line);border-radius:12px;padding:4px;display:inline-block}.qrbox svg{display:block;width:100%;height:100%}
/* ---------- Surat suara ---------- */
.cand-ph.pair{display:block;aspect-ratio:4/3;max-height:46vh;width:100%;background:linear-gradient(150deg,var(--c-blue5),var(--c-blue1))}
.cand-ph.pair img{width:100%;height:100%;object-fit:cover;object-position:center 25%;display:block}
.pp-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:14px}
.pp-ph .ini{display:grid;place-items:center;width:clamp(56px,22%,104px);aspect-ratio:1;border-radius:50%;background:#fff;color:var(--c-blue);font-size:clamp(26px,5vw,44px);font-weight:800;box-shadow:0 4px 14px rgba(11,58,94,.15)}
.pp-ph .amp{font-size:26px;font-weight:800;color:var(--c-navy);opacity:.5}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}.duo .role{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--c-blue6)}.duo h3{font-size:17px!important}
.cf-two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media (max-width:700px){.cf-two{grid-template-columns:1fr}}
.vb{min-height:100%;display:flex;flex-direction:column}
.vb-head{display:flex;align-items:center;gap:14px;padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--c-line);background:rgba(255,255,255,.9);position:sticky;top:0;z-index:5;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.vb-head img{width:44px;height:44px}
.vb-body{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px}
.vb-body h2{font-size:clamp(24px,3vw,34px);font-weight:800;color:var(--c-navy);text-wrap:balance;line-height:1.2}
.cands{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px}
.cand{position:relative;text-align:left;border-radius:20px;overflow:hidden;background:#fff;border:2px solid var(--c-line);display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s,border-color .15s}
.cand:hover{transform:translateY(-2px);box-shadow:0 14px 34px -14px rgba(11,58,94,.3)}
.cand.sel{border-color:var(--c-blue);box-shadow:0 0 0 5px rgba(0,144,200,.2),0 14px 34px -14px rgba(11,58,94,.35)}
.cand-ph{aspect-ratio:4/4.4;background:linear-gradient(150deg,var(--c-blue5),var(--c-blue1));display:grid;place-items:center;position:relative;overflow:hidden}
.cand-ph img{width:100%;height:100%;object-fit:cover;display:block}
.cand-ph .ini{font-size:72px;font-weight:800;color:var(--c-blue);opacity:.55}
.cand-no{position:absolute;left:14px;top:14px;width:48px;height:48px;border-radius:50%;background:var(--c-gold);color:var(--c-navy);font-weight:800;font-size:24px;display:grid;place-items:center;box-shadow:0 6px 14px -4px rgba(0,0,0,.3)}
.cand-tick{position:absolute;right:14px;top:14px;width:40px;height:40px;border-radius:50%;background:var(--c-blue6);color:#fff;display:none;place-items:center}
.cand.sel .cand-tick{display:grid}
.cand-info{padding:16px 18px 20px;display:flex;flex-direction:column;gap:8px}
.cand-info h3{font-size:20px;font-weight:800;color:var(--c-navy);line-height:1.25}
.cand-info p{font-size:14px;color:var(--c-muted)}
.cand-info ul{padding-left:18px;font-size:13.5px;color:var(--c-ink)}
.vb-bar{position:fixed;left:0;right:0;bottom:0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;z-index:6;border-top:1px solid var(--c-line);background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.idle{font-size:13px;font-weight:700;color:#8F1717;background:var(--c-red5);padding:6px 12px;border-radius:99px}
.done{min-height:100%;display:grid;place-items:center;padding:24px;text-align:center}
.done-card{max-width:520px;display:flex;flex-direction:column;align-items:center;gap:14px}
.done-ic{width:104px;height:104px;border-radius:50%;background:var(--c-green);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 14px var(--c-green5);animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.done-ic .i{width:56px;height:56px;stroke-width:3}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.done h2{font-size:30px;font-weight:800;color:var(--c-navy)}

/* ---------- Admin shell ---------- */
.sh{min-height:100%;display:grid;grid-template-columns:268px 1fr}
.sb{position:sticky;top:0;height:100vh;height:100dvh;background:linear-gradient(180deg,var(--c-navy),#0A4B78);color:#fff;display:flex;flex-direction:column;padding:20px 14px;gap:6px;overflow:auto}
.sb-brand{display:flex;gap:12px;align-items:center;padding:6px 8px 16px;border-bottom:1px solid rgba(255,255,255,.14);margin-bottom:10px}
.sb-brand .logo-badge{width:50px;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.16)}.sb-brand img{width:80%;height:auto;display:block}
.sb-brand b{display:block;font-size:15px;line-height:1.2}.sb-brand span{font-size:12px;color:#F7C600}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border-radius:12px;font-weight:600;color:rgba(255,255,255,.82);text-align:left;transition:background .15s}
.nav-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.nav-btn.on{background:#fff;color:var(--c-navy);font-weight:800}
.sb-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.14);display:flex;flex-direction:column;gap:10px;font-size:12px;color:rgba(255,255,255,.75)}
.sb-foot b{color:#fff}
.mn{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:22px 32px 0}
.top h1{font-size:26px;font-weight:800;color:var(--c-navy);line-height:1.2}
.pg{padding:20px 32px 48px;display:flex;flex-direction:column;gap:20px;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;gap:6px}
.tile .k{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--c-muted);display:flex;gap:8px;align-items:center}
.tile .v{font-size:34px;font-weight:800;color:var(--c-navy);line-height:1;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px}
.qc{display:flex;flex-direction:column;gap:16px}
.qc-row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center}
.qc-no{width:44px;height:44px;border-radius:50%;background:var(--c-gold);color:var(--c-navy);font-weight:800;font-size:20px;display:grid;place-items:center}
.qc-row.lead .qc-no{box-shadow:0 0 0 4px var(--c-gold5)}
.qc-n{text-align:right;font-variant-numeric:tabular-nums}.qc-n b{font-size:24px;color:var(--c-navy)}
.qc .bar{height:16px;margin-top:6px}
.cls-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.cls{border:1px solid var(--c-line);border-radius:12px;padding:8px 10px;background:#fff;display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.cls b{font-size:14px;color:var(--c-navy)}.cls .bar{height:7px}
.tbl-wrap{overflow:auto;border:1px solid var(--c-line);border-radius:14px;background:#fff;max-width:100%}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{position:sticky;top:0;background:var(--c-surf);text-align:left;padding:10px 14px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--c-muted);border-bottom:1px solid var(--c-line);white-space:nowrap}
.tbl td{padding:9px 14px;border-bottom:1px solid #EAF1F5;vertical-align:middle}
.tbl tr:nth-child(even) td{background:#FAFCFE}
.tbl tr:hover td{background:var(--c-blue5)}
.tbl input[type=checkbox],.pick input[type=checkbox]{width:18px;height:18px;accent-color:var(--c-blue6)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tools .inp{width:auto;min-width:150px}
.tools .search{flex:1;min-width:200px;position:relative}.tools .search .i{position:absolute;left:13px;top:13px;color:var(--c-muted)}.tools .search .inp{padding-left:40px;width:100%}
.pager{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:13px;color:var(--c-muted)}
.selbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--c-navy);color:#fff;border-radius:14px;padding:10px 14px}
.selbar .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.pick{display:flex;flex-direction:column;gap:14px}
.pick-g{display:flex;flex-direction:column;gap:8px}
.pick-h{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--c-navy)}
.pick-c{display:flex;flex-wrap:wrap;gap:8px}
.pk{position:relative;display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:12px;border:1.5px solid var(--c-line);background:#fff;font-weight:700;font-size:13px;cursor:pointer;user-select:none}
.pk input{position:absolute;opacity:0;pointer-events:none}
.pk.on{background:var(--c-blue5);border-color:var(--c-blue);color:var(--c-navy)}
.pk.danger.on{background:var(--c-red5);border-color:var(--c-red);color:#8F1717}
.pk small{font-weight:600;color:var(--c-muted)}
.pk:has(input:focus-visible){outline:3px solid var(--c-gold);outline-offset:2px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.ccard{overflow:hidden;padding:0;display:flex;flex-direction:column}
.ccard .cand-ph.pair{aspect-ratio:4/3}
.ccard .b{padding:14px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.pair-up{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:6px 0 14px}.pair-up .cand-ph.pair{width:240px;max-width:100%;border-radius:14px;flex:none}.pair-up .fld{min-width:200px}
.ph-up .cand-ph{width:96px;height:106px;border-radius:14px;aspect-ratio:auto;flex:none}
.ph-up .cand-ph .ini{font-size:36px}
.prog{display:flex;flex-direction:column;gap:8px}
.sw{position:relative;display:inline-block;width:46px;height:26px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:99px;background:#C3D5DF;transition:.2s}
.sw i:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked+i{background:var(--c-green)}.sw input:checked+i:after{transform:translateX(20px)}
.sw input:focus-visible+i{outline:3px solid var(--c-gold);outline-offset:2px}
.set-row{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid #EAF1F5}
.set-row:last-child{border:0}
.blur{filter:blur(9px);user-select:none;pointer-events:none}

/* ---------- Navigasi bawah (mobile) ---------- */
.bn{display:none}
@media (max-width:899px){
  .vl{grid-template-columns:1fr}
  .vl-side{flex-direction:row;padding:18px 18px;gap:14px;text-align:left;justify-content:flex-start}
  .vl-side:before,.vl-side:after,.vl-side .credit,.vl-side p.hide-m{display:none}

  .bn{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;padding:6px;border-radius:22px;justify-content:space-around;gap:2px}

/* ---------- Modal, toast ---------- */
.md{position:fixed;inset:0;z-index:50;background:rgba(11,58,94,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}

.toast{pointer-events:auto;background:var(--c-navy);color:#fff;padding:12px 16px;border-radius:14px;font-weight:600;font-size:14px;box-shadow:0 14px 30px -10px rgba(0,0,0,.4);animation:tin .25s ease both;display:flex;gap:10px;align-items:center}

.net{position:fixed;left:50%;transform:translateX(-50%);top:10px;z-index:60;background:var(--c-red);color:#fff;font-weight:700;font-size:13px;padding:8px 16px;border-radius:99px;display:flex;gap:8px;align-items:center}

    let done = 0;
    for (const part of chunks(items, size)) { ok(await call(part)); done += part.length; onProgress && onProgress(done, items.length); }
    if (!items.length) onProgress && onProgress(0, 0);
  }

  return {
    mode: "supabase",
    // Admin: sesi Supabase Auth yang emailnya terdaftar di tabel admins. Tanpa sesi = layar bilik (anon).
    onAuth: (cb) => {
      let last;
      const push = async (session) => {
        let email = null;
        if (session && session.user) {
          const r = await sb.rpc("is_admin");
          if (r.error) { if (!(last === null)) { last = null; cb(null); } return; }
          if (r.data === true) email = String(session.user.email || "").toLowerCase();
          else { await sb.auth.signOut(); return; }
        }
        if (email === last) return;
        last = email; cb(email);
      };
      const { data } = sb.auth.onAuthStateChange((ev, session) => { setTimeout(() => push(session), 0); });
      sb.auth.getSession().then(({ data: d }) => push(d.session));
      return () => { try { data.subscription.unsubscribe(); } catch (e) { /* abaikan */ } };
    },
    async signIn(email, pw) {
      const r = await sb.auth.signInWithPassword({ email: String(email).trim(), password: pw });
      fail(r.error);
      const a = await sb.rpc("is_admin");
      if (a.error || a.data !== true) {
        await sb.auth.signOut();
        if (a.error) fail(a.error);
        throw Object.assign(new Error("Akun ini tidak terdaftar sebagai admin."), { code: "not-admin" });
      }
    },
    async signOut() { fail((await sb.auth.signOut()).error); },

    watchSettings: (cb, err) => watchQuery(["settings"], async () => ({ ...DEFAULT_SETTINGS, ...mapSet(ok(await sb.from("settings").select("*").eq("id", "main").maybeSingle())) }), cb, err, { poll: 8000, wait: 200 }),
    watchCands: (cb, err) => watchQuery(["candidates"], async () => ok(await sb.from("candidates").select("*").order("no_urut", { ascending: true })).map(mapCand), cb, err, { poll: 120000, wait: 300 }),
    watchVoters: (cb, err) => watchQuery(["voters"], async () => (await fetchAll("voters", VOTER_COLS, "nipd")).map(mapVoter), cb, err, { poll: 30000, wait: 1200 }),
    watchVotes: (cb, err) => watchQuery(["votes"], async () => (await fetchAll("votes", "id,calon_id,kelas", "id")).map((r) => ({ id: r.id, calonId: r.calon_id, kelas: r.kelas })), cb, err, { poll: 30000, wait: 1200 }),
    // Statistik dihitung langsung oleh database (fungsi statistik_pemilihan): selalu sama dengan data asli
    watchStats: (cb, err) => watchQuery(["voters", "votes"], async () => ok(await sb.rpc("statistik_pemilihan")), cb, err, { poll: 20000, wait: 500 }),
    // 100 pemilih yang terakhir memilih (siapa dan kapan, TANPA pilihannya), untuk log di menu Kotak Suara
    watchRecent: (cb, err) => watchQuery(["voters"], async () => ok(await sb.from("voters").select(VOTER_COLS).not("waktu_memilih", "is", null).order("waktu_memilih", { ascending: false }).limit(100)).map(mapVoter), cb, err, { poll: 20000, wait: 800 }),

    async saveSettings(p) {
      const m = {};
      for (const k in p) if (SET_MAP[k]) m[SET_MAP[k]] = p[k];
      m.updated_at = new Date().toISOString();
      const rows = ok(await sb.from("settings").update(m).eq("id", "main").select("id"));
      if (!rows.length) ok(await sb.from("settings").insert({ id: "main", ...m }));
    },
    async saveCandidate(c) {
      const id = c.id || newId();
      ok(await sb.from("candidates").upsert({ id, no_urut: Number(c.noUrut) || 0, nama: c.nama || "", kelas: c.kelas || "", foto: c.foto || "", nama_wakil: c.namaWakil || "", kelas_wakil: c.kelasWakil || "", visi: c.visi || "", misi: c.misi || "", aktif: c.aktif !== false }, { onConflict: "id" }));
      return id;
    },
    async deleteCandidate(id) { ok(await sb.from("candidates").delete().eq("id", id)); },

    // Login pemilih: dicocokkan di database lewat fungsi login_pemilih. null = NIPD atau token tidak cocok.
    async getVoter(nipd, tokenHash) {
      const r = ok(await sb.rpc("login_pemilih", { p_nipd: nipd, p_token_hash: tokenHash }));
      return r ? { id: r.nipd, nipd: r.nipd, nama: r.nama, kelas: r.kelas, tingkat: r.tingkat, kategori: r.kategori, sudahMemilih: !!r.sudahMemilih, bilik: r.bilik == null ? null : r.bilik, waktuMemilih: null } : null;
    },
    async getTokens() { const o = {}; (await fetchAll("voter_tokens", "nipd,token", "nipd")).forEach((r) => { o[r.nipd] = r.token; }); return o; },

    async upsertVoters(items, onProgress) {
      const news = items.filter((i) => i.isNew), olds = items.filter((i) => !i.isNew), total = items.length;
      let done = 0; const step = (d) => { done += d; onProgress && onProgress(done, total); };
      for (const part of chunks(news, 300)) {
        ok(await sb.rpc("admin_tambah_pemilih", { p_items: part.map((it) => ({ nipd: it.nipd, nama: it.nama, kelas: it.kelas, tingkat: it.tingkat, kategori: it.kategori || "siswa", tokenHash: it.tokenHash, token: it.token })) }));
        step(part.length);
      }
      for (const part of chunks(olds, 300)) {
        ok(await sb.rpc("admin_ubah_pemilih", { p_items: part.map((it) => ({ nipd: it.nipd, nama: it.nama, kelas: it.kelas, tingkat: it.tingkat, kategori: it.kategori || "siswa" })) }));
        step(part.length);
      }
      if (!total) onProgress && onProgress(0, 0);
    },
    regenTokens: (items, onProgress) => runChunks(items, 300, (part) => sb.rpc("admin_ganti_token", { p_items: part.map((it) => ({ nipd: it.nipd, tokenHash: it.tokenHash, token: it.token })) }), onProgress),
    deleteVoters: (list, onProgress) => runChunks(list, 500, (part) => sb.rpc("admin_hapus_pemilih", { p_nipds: part.map((v) => v.nipd) }), onProgress),
    deleteVotes: (list, onProgress) => runChunks(list, 500, (part) => sb.rpc("admin_hapus_suara", { p_ids: part.map((v) => v.id) }), onProgress),
    resetVoterStatus: (list, onProgress) => runChunks(list, 500, (part) => sb.rpc("admin_reset_status", { p_nipds: part.map((v) => v.nipd) }), onProgress),

    // Kirim suara: satu transaksi di database (cek buka, token, belum memilih, calon valid; simpan suara; tandai pemilih)
    async castVote({ nipd, calonId, bilik, voteId, tokenHash }) {
      const call = sb.rpc("kirim_suara", { p_nipd: nipd, p_token_hash: tokenHash, p_calon_id: calonId, p_bilik: bilik, p_vote_id: voteId });
      const res = await Promise.race([call, sleep(15000).then(() => { throw Object.assign(new Error("timeout"), { code: "timeout" }); })]);
      fail(res.error);
    }
  };
}

function explainErr(e) {
  const c = e && e.code ? String(e.code) : "", m = e && e.message ? String(e.message) : "";
  if (c === "not-admin") return "Akun ini tidak terdaftar sebagai admin. Tambahkan emailnya ke tabel admins (lihat panduan).";
  if (c === "locked") return "Terlalu banyak percobaan salah untuk NIPD/NIP/ID ini. Tunggu 1 menit lalu coba lagi.";
  if (c.includes("permission-denied")) return "Akses ditolak oleh database. Pemungutan suara mungkin ditutup, pemilih sudah memilih, atau Anda belum login sebagai admin. Pastikan schema.sql sudah dijalankan.";
  if (c.includes("fk-violation")) return "Pasangan ini sudah memiliki suara di kotak suara. Reset kotak suara dulu di menu Reset & Pengelolaan, atau nonaktifkan pasangan agar tidak tampil di surat suara.";
  if (/invalid_credentials|invalid-credential|wrong-password|user-not-found|invalid-email/.test(c) || /invalid login credentials/i.test(m)) return "Email atau kata sandi salah.";
  if (c.includes("email_not_confirmed")) return "Email admin belum dikonfirmasi. Di Supabase buka Authentication, Users, lalu konfirmasi pengguna (atau buat ulang dengan Auto Confirm User).";
  if (c.includes("too-many-requests") || c.includes("over_request_rate_limit") || c === "429") return "Terlalu banyak percobaan. Coba lagi beberapa saat lagi.";
  if (c.includes("network") || c.includes("unavailable") || c === "timeout") return "Koneksi internet bermasalah. Periksa jaringan lalu coba lagi.";
  if (c === "PGRST202" || c === "PGRST205" || c === "42P01" || /could not find the (function|table)|does not exist/i.test(m)) return "Tabel atau fungsi Supabase belum ada. Jalankan schema.sql di SQL Editor Supabase lalu muat ulang halaman.";
  return m ? m : "Terjadi kesalahan tak terduga.";
}

const S = { db: null, email: null, role: null, settings: { ...DEFAULT_SETTINGS }, cands: [], voters: [], votes: [], stats: null, recent: [], unsubs: [], lazy: {}, ready: { settings: false, cands: false, voters: false, votes: false, stats: false, recent: false } };
const view = () => $("#ev-view");
let lastErrAt = 0;

function toast(msg, type = "") {
  const box = $("#ev-toasts"); if (!box) return;
  const el = document.createElement("div"); el.className = "toast " + type; el.setAttribute("role", "status");
  el.innerHTML = (type === "ok" ? ic("check") : type === "err" ? ic("alert") : "") + `<span>${esc(msg)}</span>`;
  box.appendChild(el); setTimeout(() => el.remove(), type === "err" ? 7000 : 3500);
}
const dataErr = (e) => { if (Date.now() - lastErrAt > 4000) { lastErrAt = Date.now(); toast(explainErr(e), "err"); } console.error(e); };

// Modal: kembalikan fungsi close. actions: [{label, cls, onClick(close, el)}]
function openModal({ title, body, actions = [], wide = false, persistent = false, onOpen, onClose }) {
  const layer = $("#ev-modal");
  const wrap = document.createElement("div"); wrap.className = "md"; wrap.setAttribute("role", "dialog"); wrap.setAttribute("aria-modal", "true");
  wrap.innerHTML = `<div class="md-box ${wide ? "wide" : ""}"><div class="md-h"><h3>${esc(title)}</h3>${persistent ? "" : `<button class="ibtn" data-x aria-label="Tutup">${ic("x")}</button>`}</div><div class="md-b">${body}</div>${actions.length ? `<div class="md-f"></div>` : ""}</div>`;
  let closed = false;
  const close = () => { if (closed) return; closed = true; wrap.remove(); document.removeEventListener("keydown", onKey, true); onClose?.(); };
  const onKey = (e) => { if (e.key === "Escape" && !persistent && layer.lastElementChild === wrap) close(); };
  document.addEventListener("keydown", onKey, true);
  const foot = $(".md-f", wrap);
  actions.forEach((a) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "btn " + (a.cls || "ghost"); b.textContent = a.label; if (a.id) b.id = a.id;
    b.addEventListener("click", () => a.onClick ? a.onClick(close, wrap, b) : close()); foot.appendChild(b);
  });
  $("[data-x]", wrap)?.addEventListener("click", close);
  if (!persistent) wrap.addEventListener("mousedown", (e) => { if (e.target === wrap) close(); });
  layer.appendChild(wrap); onOpen?.(wrap, close);
  const f = $("input,textarea,select", wrap) || $("button.btn:last-child", wrap); f?.focus();
  return close;
}
// Konfirmasi tanpa window.confirm. type: kata yang harus diketik (opsional)
function askConfirm({ title, msg, ok = "Ya, lanjutkan", danger = false, type = "" }) {
  return new Promise((res) => {
    let done = false; const fin = (v, close) => { if (!done) { done = true; res(v); } close?.(); };
    openModal({
      title, persistent: false,
      body: `<div class="${danger ? "alert err" : "alert"}">${ic(danger ? "alert" : "shield")}<div>${msg}</div></div>` + (type ? `<div class="fld"><label for="cf-t">Ketik <b>${esc(type)}</b> untuk melanjutkan</label><input class="inp" id="cf-t" autocomplete="off" spellcheck="false"></div>` : ""),
      actions: [
        { label: "Batal", cls: "ghost", onClick: (c) => fin(false, c) },
        { label: ok, cls: danger ? "red" : "", id: "cf-ok", onClick: (c, el) => { if (type && $("#cf-t", el).value.trim().toUpperCase() !== type) { $("#cf-t", el).focus(); toast(`Ketik "${type}" dengan benar`, "err"); return; } fin(true, c); } }
      ],
      onClose: () => fin(false)
    });
  });
}
function setBusy(btn, busy, label) {
  if (!btn) return;
  if (busy) { btn.dataset.l = btn.innerHTML; btn.disabled = true; btn.textContent = label || "Memproses…"; }
  else { btn.disabled = false; if (btn.dataset.l) btn.innerHTML = btn.dataset.l; }
}

function clearSubs() { S.unsubs.forEach((u) => { try { u(); } catch (e) { /* abaikan */ } }); S.unsubs = []; }
function onData(kind) {
  S.ready[kind] = true;
  if (S.role === "booth") Voter.onData(kind); else if (S.role === "admin") Admin.onData(kind);
}
async function onAuthChange(email) {
  // email != null: admin (Supabase Auth, terdaftar di tabel admins). Tanpa sesi: layar bilik/pemilih (anon), kecuali alamat berakhiran #admin.
  Voter.stop(); Admin.stop(); clearSubs();
  S.email = email; S.role = email ? "admin" : (location.hash === "#admin" ? null : "booth");
  S.cands = []; S.voters = []; S.votes = []; S.stats = null; S.statsErr = null; S.recent = []; S.lazy = {}; S.ready = { settings: false, cands: false, voters: false, votes: false, stats: false, recent: false };
  if (!S.role) return renderStaffLogin();
  // Tampilkan kerangka dulu, baru berlangganan data (agar data pertama tidak tertimpa layar "memuat")
  if (S.role === "admin") Admin.start(); else Voter.start();
  const sub = (fn, kind, assign) => S.unsubs.push(fn((d) => { assign(d); onData(kind); }, dataErr));
  sub(S.db.watchSettings, "settings", (d) => { S.settings = { ...DEFAULT_SETTINGS, ...d }; });
  sub(S.db.watchCands, "cands", (d) => { S.cands = d; });
  // Admin selalu memantau statistik (dihitung database). Daftar pemilih/suara lengkap hanya dimuat saat halaman yang butuh dibuka (lihat Admin.syncNeeds).
  if (S.role === "admin") S.unsubs.push(S.db.watchStats((d) => { S.statsErr = null; S.stats = d; onData("stats"); }, (e) => { S.statsErr = e; dataErr(e); Admin.onData("statsErr"); }));
}

// ---------- Alur pemilih di bilik: login -> surat suara -> sukses -> login ----------
const Voter = (() => {
  const V = { step: "login", voter: null, choice: null, voteId: null, fail: 0, lockUntil: 0, idleAt: 0, idleTimer: 0, doneTimer: 0, taps: [], sending: false };
  const bilikNo = () => { const m = location.hash.match(/^#bilik-(\d{1,2})$/); return m ? +m[1] : null; };
  const cands = () => S.cands.filter((c) => c.aktif !== false).sort((a, b) => (a.noUrut || 0) - (b.noUrut || 0));
  const isOpen = () => S.settings.status === "buka";

  function reset() { stopCam(); clearInterval(V.idleTimer); clearTimeout(V.doneTimer); Object.assign(V, { step: "login", voter: null, choice: null, voteId: null, sending: false }); }
  function start() { loadingView("Menyiapkan bilik…"); window.addEventListener("hashchange", render); window.addEventListener("online", netChange); window.addEventListener("offline", netChange); netChange(); }
  function stop() { reset(); document.removeEventListener("pointerdown", bump, true); document.removeEventListener("keydown", bump, true); window.removeEventListener("hashchange", render); window.removeEventListener("online", netChange); window.removeEventListener("offline", netChange); }
  function onData(kind) {
    if (kind !== "settings" && kind !== "cands") return;
    if (V.step === "login") { if ($("#vl-form")) updateLoginStatus(); else render(); }
    if (V.step === "ballot" && kind === "settings" && !isOpen() && !V.sending) cancel("Pemilihan telah ditutup oleh panitia.");
    // Daftar pasangan calon diubah panitia saat surat suara terbuka: segarkan tampilan dan batalkan pilihan yang sudah tidak ada
    if (V.step === "ballot" && kind === "cands" && !V.sending && !$("#ev-modal .md")) {
      const gone = V.choice && !cands().some((c) => c.id === V.choice), keep = gone ? null : V.choice;
      renderBallot(); if (keep) select(keep); if (gone) toast("Daftar calon diperbarui panitia. Silakan pilih kembali.", "err"); V.choice = keep;
    }
  }
  function netChange() { const n = $("#ev-net"); if (n) n.hidden = navigator.onLine; }

  function render() {
    if (S.role !== "booth") return;
    if (!S.ready.settings) return loadingView("Menyiapkan bilik…");
    if (!bilikNo()) return renderPick();
    if (V.step === "login") renderLogin(); else if (V.step === "ballot") renderBallot(); else renderDone();
  }

  function renderPick() {
    const n = Math.max(1, Math.min(20, +S.settings.jumlahBilik || 3));
    view().innerHTML = `${previewBanner()}<div class="vl ev-bg">${sidePanel()}<main class="vl-main"><div class="vl-card glass card"><h2>Pilih nomor bilik</h2><p class="muted">Pilih nomor bilik untuk laptop ini. Pilihan ini hanya dipakai untuk mencatat bilik pada data, dan tersimpan di alamat halaman.</p><div class="bilik-pick">${Array.from({ length: n }, (_, i) => `<button class="btn ghost" data-b="${i + 1}">Bilik ${i + 1}</button>`).join("")}</div></div>${staffBtnHtml()}${creditHtml()}</main></div>`;
    $("#vl-staff").addEventListener("click", openStaffGate);
    $$("[data-b]").forEach((b) => b.addEventListener("click", () => { location.hash = "bilik-" + b.dataset.b; }));
  }

  function renderLogin() {
    clearInterval(V.idleTimer);

  // ----- Scan QR (kamera) -----

            const cx = cv.getContext("2d", { willReadFrequently: true }); cx.drawImage(bmp, 0, 0, cv.width, cv.height); const d = cx.getImageData(0, 0, cv.width, cv.height), r = window.jsQR(d.data, d.width, d.height);
            if (!r) setMsg("QR tidak ditemukan pada gambar. Coba foto yang lebih jelas.", true); else onCode(r.data);
          } catch (er) { setMsg("Gambar tidak bisa dibaca.", true); }

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return setMsg("Kamera tidak tersedia. Kamera hanya bisa dipakai lewat alamat HTTPS. Gunakan foto QR atau masukkan NIPD/NIP dan token.", true);
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
          if (!el.isConnected) { stream.getTracks().forEach((t) => t.stop()); return; }
          cam = { stream, closed: false }; v.srcObject = stream; await v.play();

          const cv = document.createElement("canvas"), cx = cv.getContext("2d", { willReadFrequently: true });

              cx.drawImage(v, 0, 0, cv.width, cv.height); const d = cx.getImageData(0, 0, cv.width, cv.height), r = window.jsQR(d.data, d.width, d.height, { inversionAttempts: "dontInvert" });

// ---------- Dashboard admin: shell, navigasi, dashboard, kotak suara, pengaturan ----------
const A = { page: "dash", cur: null, raf: 0, tokens: null, P: { q: "", kat: "", kelas: "", st: "", page: 1, sel: new Set() }, tk: { sel: new Set(), onlyLeft: true }, rs: { votes: new Set(), voters: new Set(), revote: true, alsoVotes: false } };
const Pages = {};

const BOTTOM = ["dash", "voters", "cands", "box"];
// Data besar hanya diunduh dari Supabase selama halaman yang membutuhkannya terbuka
const NEEDS = { voters: ["voters"], tokens: ["voters"], reset: ["voters", "votes"], box: ["recent"] };
const LAZY = { voters: "watchVoters", votes: "watchVotes", recent: "watchRecent" };

const Admin = (() => {

  }
  return { start, stop, onData: refresh, show };
})();

function computeStats() {
  const z = S.stats || buildStats([], []), kv = new Map(), byBilik = new Map(Object.entries(z.bilik || {}).filter(([, n]) => n > 0));
  Object.entries(z.kelas || {}).forEach(([k, o]) => { if ((o.t || 0) > 0 || (o.v || 0) > 0) kv.set(k, { total: Math.max(0, o.t || 0), voted: Math.max(0, o.v || 0) }); });
  let total = 0, voted = 0; kv.forEach((o) => { total += o.total; voted += o.voted; });
  const cnt = new Map(Object.entries(z.cand || {}));
  const list = [...S.cands].sort((a, b) => (a.noUrut || 0) - (b.noUrut || 0)).map((c) => ({ c, n: Math.max(0, cnt.get(c.id) || 0) }));
  const orphan = [...cnt.entries()].filter(([id]) => !S.cands.some((c) => c.id === id)).reduce((a, [, n]) => a + Math.max(0, n), 0);
  const th = TINGKAT.map((t) => { let tt = 0, vv = 0; kv.forEach((o, k) => { if ((parseKelas(k) || {}).tingkat === t) { tt += o.total; vv += o.voted; } }); return { t, total: tt, voted: vv }; });
  return { total, voted, left: total - voted, part: pct(voted, total), list, orphan, totalVotes: Math.max(0, z.votes || 0), votedCounter: Math.max(0, z.voted || 0), byBilik, kv, th };
}

}

function parseSheet(buf) {
  if (!window.XLSX) throw new Error("Pustaka Excel belum termuat. Periksa koneksi internet lalu muat ulang halaman.");
  const wb = XLSX.read(buf, { type: "array" }), ws = wb.Sheets[wb.SheetNames[0]];
  const all = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", raw: false });
  const isId = (x) => /^(nipd|nis|nip|id)(\b|$)/.test(x) || /nipd|nip\s*[\/&]/.test(x);
  const hi = all.findIndex((r) => r.some((c) => isId(String(c).trim().toLowerCase())));
  if (hi < 0) throw new Error("Kolom NIPD atau NIP / ID tidak ditemukan. Siswa: NIPD, NAMA LENGKAP, KELAS. Guru/Staff: NIP / ID, NAMA LENGKAP, KATEGORI.");
  const h = all[hi].map((c) => String(c).trim().toLowerCase());
  const ci = { n: h.findIndex(isId), m: h.findIndex((x) => /nama/.test(x)), k: h.findIndex((x) => /kelas|rombel|kategori/.test(x)) };
  if (ci.m < 0 || ci.k < 0) throw new Error("Kolom NAMA LENGKAP dan KELAS (siswa) atau KATEGORI (guru/staff) harus ada.");
  const seen = new Set(), rows = [], bad = []; let dup = 0, total = 0;
  for (const r of all.slice(hi + 1)) {
    const nipd = normId(r[ci.n]), nm = String(r[ci.m] ?? "").trim().replace(/\s+/g, " "), kl = parseKelas(r[ci.k]), guru = kl?.tingkat === "GURU", nama = guru ? nm : nm.toUpperCase();
    if (!nipd && !nm) continue; total++;
    if (!NIPD_OK.test(nipd) || !nama || !kl) { bad.push(`${nipd || "(kosong)"} · ${nama || "(tanpa nama)"} · ${r[ci.k] || "(tanpa kelas)"}`); continue; }
    if (seen.has(nipd)) { dup++; continue; } seen.add(nipd);
    rows.push({ nipd, nama, kelas: kl.kelas, tingkat: kl.tingkat, kategori: guru ? "guru" : "siswa" });
  }
  return { rows, bad, dup, total };
}

function fileToDataUrl(file, max = 480, ratio = 0) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      let sx = 0, sy = 0, sw = img.width, sh = img.height;
      if (ratio) { if (sw / sh > ratio) { sw = Math.round(sh * ratio); sx = Math.round((img.width - sw) / 2); } else { sh = Math.round(sw / ratio); sy = Math.round((img.height - sh) / 3); } } // potong tengah (vertikal condong ke atas agar wajah aman)
      const r = Math.min(1, max / Math.max(sw, sh)), c = document.createElement("canvas"); c.width = Math.round(sw * r); c.height = Math.round(sh * r);
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.imageSmoothingQuality = "high"; x.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("File gambar tidak bisa dibaca.")); }; img.src = url;
  });
}

  mount(el) {
    el.innerHTML = `<div class="tools"><button class="btn" id="c-add">${ic("plus")} Tambah pasangan calon</button><span class="muted small">Foto disimpan terkompres di database, tidak perlu layanan penyimpanan tambahan.</span></div><div class="cgrid" id="c-grid"></div>`;
    $("#c-add").addEventListener("click", () => candForm());
    $("#c-grid").addEventListener("click", async (e) => {
      const b = e.target.closest("[data-act]"); if (!b) return; const c = S.cands.find((x) => x.id === b.dataset.id); if (!c) return;
      if (b.dataset.act === "edit") candForm(c);
      else if (await askConfirm({ title: "Hapus pasangan calon?", msg: `Menghapus pasangan <b>${esc(pairName(c))}</b>. Jika pasangan ini sudah punya suara, penghapusan ditolak sampai kotak suara direset; untuk menyembunyikannya dari surat suara cukup nonaktifkan (hilangkan centang Aktif).`, ok: "Hapus", danger: true })) { try { await S.db.deleteCandidate(c.id); toast("Calon dihapus", "ok"); } catch (er) { dataErr(er); } }

  }
});
function candForm(c) {
  const edit = !!c, F = { foto: c?.foto || "" };
  const next = Math.max(0, ...S.cands.map((x) => +x.noUrut || 0)) + 1;
  const person = (p, label, nama, kelas) => `<div style="background:var(--c-surf);border:1px solid var(--c-line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0"><b style="color:var(--c-navy)">${label}</b><div class="fld"><label for="cf-nm-${p}">Nama lengkap</label><input class="inp" id="cf-nm-${p}" value="${esc(nama || "")}" maxlength="80" autocomplete="off"></div><div class="fld"><label for="cf-kl-${p}">Kelas</label><input class="inp" id="cf-kl-${p}" value="${esc(kelas || "")}" maxlength="10" autocomplete="off"></div></div>`;
  openModal({
    title: edit ? "Ubah pasangan calon" : "Tambah pasangan calon", wide: true,
    body: `<div class="fld" style="max-width:160px"><label for="cf-no">No. urut paslon</label><input class="inp" id="cf-no" type="number" min="1" value="${c?.noUrut || next}"></div>
      <div class="pair-up"><div class="cand-ph pair" id="cf-ph"></div><div class="fld grow"><label for="cf-f">Foto pasangan (satu foto berdua)</label><input class="inp" id="cf-f" type="file" accept="image/*" style="padding-top:9px"><span class="small muted">Foto otomatis dipotong rasio 4:3 dan dikompres. Gunakan foto Ketua dan Wakil berdampingan.</span><button type="button" class="btn ghost sm" id="cf-rm" style="align-self:flex-start">Hapus foto</button></div></div>
      <div class="cf-two">${person("k", "Calon Ketua OSIS", c?.nama, c?.kelas)}${person("w", "Calon Wakil Ketua OSIS", c?.namaWakil, c?.kelasWakil)}</div>
      <div class="fld"><label for="cf-vi">Visi</label><textarea class="inp" id="cf-vi" maxlength="400">${esc(c?.visi || "")}</textarea></div><div class="fld"><label for="cf-mi">Misi (satu baris satu poin)</label><textarea class="inp" id="cf-mi" maxlength="800">${esc(c?.misi || "")}</textarea></div>
      <label class="row" style="gap:10px;font-weight:700"><span class="sw"><input type="checkbox" id="cf-ak" ${c?.aktif === false ? "" : "checked"}><i></i></span> Tampilkan di surat suara</label><div id="cf-e"></div>`,
    actions: [{ label: "Batal", cls: "ghost" }, {
      label: "Simpan", onClick: async (close, el, btn) => {
        const v = (id) => $(id, el).value.trim(), no = parseInt(v("#cf-no")), err = (m) => ($("#cf-e", el).innerHTML = `<div class="alert err">${ic("alert")}<div>${esc(m)}</div></div>`);
        if (!v("#cf-nm-k")) return err("Nama calon Ketua wajib diisi."); if (!v("#cf-nm-w")) return err("Nama calon Wakil Ketua wajib diisi.");
        if (!(no >= 1)) return err("Nomor urut harus angka 1 atau lebih.");
        if (S.cands.some((x) => x.id !== c?.id && +x.noUrut === no)) return err("Nomor urut sudah dipakai pasangan lain.");
        setBusy(btn, true, "Menyimpan…");
        try { await S.db.saveCandidate({ ...(c ? { id: c.id } : {}), noUrut: no, nama: v("#cf-nm-k"), kelas: v("#cf-kl-k").toUpperCase(), foto: F.foto, namaWakil: v("#cf-nm-w"), kelasWakil: v("#cf-kl-w").toUpperCase(), visi: v("#cf-vi"), misi: v("#cf-mi"), aktif: $("#cf-ak", el).checked }); close(); toast("Pasangan calon tersimpan", "ok"); }
        catch (e) { setBusy(btn, false); err(explainErr(e)); }
      }
    }],
    onOpen: (el) => {
      const paint = () => { $("#cf-ph", el).innerHTML = pairPhotoHtml({ foto: F.foto, nama: $("#cf-nm-k", el).value, namaWakil: $("#cf-nm-w", el).value }); };
      paint(); ["k", "w"].forEach((p) => $(`#cf-nm-${p}`, el).addEventListener("input", () => { if (!F.foto) paint(); }));
      $("#cf-rm", el).addEventListener("click", () => { F.foto = ""; $("#cf-f", el).value = ""; paint(); });
      $("#cf-f", el).addEventListener("change", async (e) => { const f = e.target.files[0]; if (!f) return; try { F.foto = await fileToDataUrl(f, 900, 4 / 3); paint(); } catch (er) { toast(er.message, "err"); } });
    }
  });
}

// ===================== RESET & PENGELOLAAN =====================
Pages.reset = () => {
  const R = A.rs;
  return {
    mount(el) {
      el.innerHTML = `<section class="card glass"><div class="row" style="justify-content:space-between"><div><h3 style="color:var(--c-navy)">Reset kotak suara</h3><span class="small muted">Menghapus suara dari kelas yang dipilih. Pilih satu atau beberapa kelas.</span></div><span class="chip bad" id="r1-n"></span></div><div id="r1-pick" style="margin:14px 0"></div>
          <label class="row" style="gap:10px;margin-bottom:14px"><input type="checkbox" id="r1-re" ${R.revote ? "checked" : ""} style="width:18px;height:18px;accent-color:var(--c-blue6)"> <span><b>Izinkan pemilih di kelas ini memilih ulang</b><br><span class="small muted">Status "sudah memilih" dikembalikan ke belum memilih. Token tetap sama.</span></span></label>
          <div class="tools"><button class="btn red" id="r1-go">${ic("reset")} Reset kotak suara terpilih</button><button class="btn ghost" id="r1-all">Pilih semua kelas</button><button class="btn ghost" id="r1-no">Kosongkan pilihan</button></div></section>
        <section class="card glass"><div class="row" style="justify-content:space-between"><div><h3 style="color:var(--c-navy)">Hapus pemilih</h3><span class="small muted">Menghapus data pemilih dan token dari kelas yang dipilih. Untuk menghapus satu siswa, gunakan menu Data Pemilih.</span></div><span class="chip bad" id="r2-n"></span></div><div id="r2-pick" style="margin:14px 0"></div>
          <label class="row" style="gap:10px;margin-bottom:14px"><input type="checkbox" id="r2-av" ${R.alsoVotes ? "checked" : ""} style="width:18px;height:18px;accent-color:var(--c-blue6)"> <span><b>Hapus juga suara dari kelas yang sama</b><br><span class="small muted">Jika tidak dicentang, suara tetap di kotak suara.</span></span></label>
          <div class="tools"><button class="btn red" id="r2-go">${ic("trash")} Hapus pemilih terpilih</button><button class="btn ghost" id="r2-all">Pilih semua kelas</button><button class="btn ghost" id="r2-no">Kosongkan pilihan</button></div></section>`;
      bindPicker($("#r1-pick"), R.votes, () => this.update()); bindPicker($("#r2-pick"), R.voters, () => this.update());
      $("#r1-re").addEventListener("change", (e) => { R.revote = e.target.checked; }); $("#r2-av").addEventListener("change", (e) => { R.alsoVotes = e.target.checked; });
      const allK = () => new Set([...S.voters.map((v) => v.kelas), ...S.votes.map((v) => v.kelas)]);
      $("#r1-all").addEventListener("click", () => { allK().forEach((k) => R.votes.add(k)); this.update(); }); $("#r1-no").addEventListener("click", () => { R.votes.clear(); this.update(); });
      $("#r2-all").addEventListener("click", () => { S.voters.forEach((v) => R.voters.add(v.kelas)); this.update(); }); $("#r2-no").addEventListener("click", () => { R.voters.clear(); this.update(); });
      $("#r1-go").addEventListener("click", (e) => resetVotesAction(e.currentTarget)); $("#r2-go").addEventListener("click", (e) => deleteVotersAction(e.currentTarget));
    },
    update() {
      const vc = new Map(); S.voters.forEach((v) => { if (!vc.has(v.kelas)) vc.set(v.kelas, 0); }); S.votes.forEach((v) => vc.set(v.kelas, (vc.get(v.kelas) || 0) + 1));
      const pc = new Map(); S.voters.forEach((v) => pc.set(v.kelas, (pc.get(v.kelas) || 0) + 1));
      [...R.votes].forEach((k) => { if (!vc.has(k)) R.votes.delete(k); }); [...R.voters].forEach((k) => { if (!pc.has(k)) R.voters.delete(k); });
      $("#r1-pick").innerHTML = pickerHtml("rv", vc, R.votes, true, "suara"); $("#r2-pick").innerHTML = pickerHtml("rp", pc, R.voters, true, "pemilih");
      const nv = S.votes.filter((v) => R.votes.has(v.kelas)).length, np = S.voters.filter((v) => R.voters.has(v.kelas)).length;
      $("#r1-n").textContent = `${R.votes.size} kelas · ${fmtNum(nv)} suara`; $("#r2-n").textContent = `${R.voters.size} kelas · ${fmtNum(np)} pemilih`;
      $("#r1-go").disabled = !R.votes.size; $("#r2-go").disabled = !R.voters.size;
    }
  };
};
async function resetVotesAction(btn) {
  const R = A.rs, ks = R.votes, ids = S.votes.filter((v) => ks.has(v.kelas)), nipds = R.revote ? S.voters.filter((v) => ks.has(v.kelas) && v.sudahMemilih) : [];
  if (!(await askConfirm({ title: "Reset kotak suara?", msg: `Menghapus <b>${fmtNum(ids.length)} suara</b> dari <b>${ks.size} kelas</b> (${[...ks].sort(kelasSort).slice(0, 8).map(esc).join(", ")}${ks.size > 8 ? ", …" : ""}).${R.revote ? `<br>${fmtNum(nipds.length)} pemilih akan bisa memilih ulang.` : "<br>Status pemilih tidak diubah."}<br><b>Tindakan ini tidak bisa dibatalkan.</b>`, ok: "Reset kotak suara", danger: true, type: "RESET" }))) return;
  setBusy(btn, true, "Menghapus…");
  try { if (ids.length) await S.db.deleteVotes(ids); if (nipds.length) await S.db.resetVoterStatus(nipds); R.votes.clear(); toast(`${fmtNum(ids.length)} suara dihapus`, "ok"); } catch (e) { dataErr(e); }
  setBusy(btn, false); A.cur?.update();
}
async function deleteVotersAction(btn) {
  const R = A.rs, ks = R.voters, list = S.voters.filter((v) => ks.has(v.kelas)), ids = R.alsoVotes ? S.votes.filter((v) => ks.has(v.kelas)) : [];
  if (!(await askConfirm({ title: "Hapus pemilih?", msg: `Menghapus <b>${fmtNum(list.length)} pemilih</b> dari <b>${ks.size} kelas</b> beserta tokennya.${ids.length ? `<br>${fmtNum(ids.length)} suara dari kelas itu ikut dihapus.` : "<br>Suara di kotak suara tidak dihapus."}<br><b>Tindakan ini tidak bisa dibatalkan.</b>`, ok: "Hapus pemilih", danger: true, type: "HAPUS" }))) return;
  setBusy(btn, true, "Menghapus…");
  try { if (ids.length) await S.db.deleteVotes(ids); await S.db.deleteVoters(list); A.tokens = null; A.P.sel.clear(); R.voters.clear(); toast(`${fmtNum(list.length)} pemilih dihapus`, "ok"); } catch (e) { dataErr(e); }
  setBusy(btn, false); A.cur?.update();
}

// ---------- PWA (satu file): manifest Data URI + Service Worker dari Blob ----------
function setupPWA() {
  try {
    const m = { name: `${APP.judul} ${APP.sekolah}`, short_name: "E-Voting OSIS", description: APP.motto, start_url: location.href.split("#")[0], scope: location.href.split("#")[0], display: "standalone", orientation: "any", background_color: "#ffffff", theme_color: "#0B3A5E", icons: [{ src: LOGO, sizes: "320x320", type: "image/webp", purpose: "any" }] };
    const l = document.createElement("link"); l.rel = "manifest"; l.href = "data:application/manifest+json;base64," + btoa(unescape(encodeURIComponent(JSON.stringify(m)))); document.head.appendChild(l);
    const t = document.createElement("meta"); t.name = "theme-color"; t.content = "#0B3A5E"; document.head.appendChild(t);
    const ico = document.createElement("link"); ico.rel = "icon"; ico.href = LOGO; document.head.appendChild(ico);
    const sw = "self.addEventListener('install',function(){self.skipWaiting()});self.addEventListener('activate',function(e){e.waitUntil(self.clients.claim())});self.addEventListener('fetch',function(){});";
    if ("serviceWorker" in navigator) navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw], { type: "text/javascript" }))).catch(() => { /* Blob SW tidak didukung di semua hosting */ });
  } catch (e) { /* PWA bersifat opsional */ }
}

function fatal(msg) {
  view().innerHTML = `<div class="vl ev-bg" style="grid-template-columns:1fr"><div class="vl-main"><div class="vl-card glass card"><img src="${LOGO}" alt="" width="72" height="72"><h2>Aplikasi belum siap</h2><div class="alert err">${ic("alert")}<div>${esc(msg)}</div></div></div></div></div>`;
}

(async function boot() {
  document.documentElement.style.overflow = "hidden";
  setupPWA(); loadingView();
  if (!IS_PREVIEW) {
    if (!/^https:\/\/.+\.supabase\.(co|in)\/?$/.test(String(SUPABASE_URL).trim()) || !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY === "ANON_KEY_ANDA") return fatal("SUPABASE_URL dan SUPABASE_ANON_KEY belum diisi. Salin Project URL dan anon public key dari Supabase (Project Settings, API) ke bagian atas kode.");
    try { history.pushState(null, "", location.href); window.addEventListener("popstate", () => { if (S.role === "booth") history.pushState(null, "", location.href); }); } catch (e) { /* abaikan */ }
  } else {
    // Quick Login hanya ada di mode preview
    document.addEventListener("click", async (e) => {
      if (e.target.closest("[data-pv-admin]")) { try { await S.db.signIn(DEMO.admin[0], DEMO.admin[1]); } catch (er) { dataErr(er); } return; }
      const p = e.target.closest("[data-pv-voter]"); if (!p || S.role !== "booth") return;
      const [id, tok] = p.dataset.pvVoter.split("|");
      if (!/^#bilik-\d+$/.test(location.hash)) { location.hash = "bilik-1"; await sleep(200); }
      if (!$("#vl-nipd")) return; $("#vl-nipd").value = id; $("#vl-tok").value = tok; $("#vl-form").requestSubmit();
    });
  }
  try { S.db = IS_PREVIEW ? await createMemDB() : await createSbDB(); }
  catch (e) { console.error(e); return fatal("Gagal memuat Supabase: " + (e.message || e) + ". Periksa koneksi internet, SUPABASE_URL, dan SUPABASE_ANON_KEY."); }
  // Alamat berakhiran #admin membuka layar login admin; kembali ke alamat biasa membuka layar bilik
  window.addEventListener("hashchange", () => {
    if (S.email) return;
    const staff = location.hash === "#admin";
    if (staff && S.role === "booth") { Voter.stop(); S.role = null; renderStaffLogin(); }
    else if (!staff && S.role === null) onAuthChange(null);
  });
  S.db.onAuth(onAuthChange);
})();

</script>
